<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vue SPA with Routing</title>
  <script src="https://unpkg.com/vue@3"></script>
  <script src="https://unpkg.com/vue-router@4"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    nav { background: #333; padding: 10px; color: #fff; }
    nav a {
      color: white; text-decoration: none; margin-right: 15px;
    }
    nav a.router-link-active {
      font-weight: bold; text-decoration: underline;
    }
    .view { padding: 20px; }
  </style>
</head>
<body>
  <div id="app">
    <nav>
      <router-link to="/">Home</router-link>
      <router-link to="/about">About</router-link>
      <router-link to="/contact">Contact</router-link>
    </nav>
    <div class="view">
      <router-view></router-view>
    </div>
  </div>

  <script>
    // Define your components
    const Home = { template: `<h2>🏠 Welcome to the Home Page</h2><p>This is the home page of our SPA.</p>` };
    const About = { template: `<h2>📄 About Us</h2><p>This is the about page. Here we describe our app.</p>` };
    const Contact = { template: `<h2>📬 Contact</h2><p>This is the contact page. Reach out to us!</p>` };

    // Define routes
    const routes = [
      { path: '/', component: Home },
      { path: '/about', component: About },
      { path: '/contact', component: Contact },
    ];

    // Create the router
    const router = VueRouter.createRouter({
      history: VueRouter.createWebHashHistory(),
      routes
    });

    // Create the app
    const app = Vue.createApp({});
    app.use(router);
    app.mount('#app');
  </script>
</body>
</html>
